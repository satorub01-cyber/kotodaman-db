[xdebug]
xdebug.mode = debug
xdebug.start_with_request = trigger
; DevContainer内ではVS Codeデバッガがコンテナ内(127.0.0.1:9003)で動作しているため、
; discover_client_host は無効化(0)にし、client_host を 127.0.0.1 に固定する
xdebug.discover_client_host = 0
xdebug.client_host = 127.0.0.1
xdebug.client_port = 9003
; エラー調査用のログを出力
xdebug.log = /tmp/xdebug.log
xdebug.log_level = 7
